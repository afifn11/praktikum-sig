<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Satu - Peta Indonesia (Leaflet + OSM)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }
        header {
            background: #1e3a8a;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        nav a {
            color: #dbeafe;
            text-decoration: none;
            margin-left: 16px;
            font-size: 0.9rem;
        }
        nav a:hover { color: #fff; text-decoration: underline; }
        #map {
            width: 100%;
            height: calc(100vh - 54px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Peta Indonesia - Modul 1 (Peta Satu)</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/petasatu/">Peta Satu</a>
            <a href="/petadua/">Peta Dua (Jabodetabek)</a>
            <a href="/gempabumi/">Gempabumi BMKG</a>
        </nav>
    </header>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        // Center on Indonesia
        const map = L.map('map').setView([-2.5489, 118.0149], 5);

        // Basemaps
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri'
        });

        // Marker Layer Group for Jakarta
        const markerLayer = L.layerGroup();
        const jakartaMarker = L.marker([-6.2088, 106.8456]).bindPopup(
            '<strong>DKI Jakarta</strong><br>Ibu Kota Indonesia<br>Koordinat: -6.2088, 106.8456'
        );
        jakartaMarker.addTo(markerLayer);
        markerLayer.addTo(map);

        // Scale Control
        L.control.scale({ metric: true, imperial: false }).addTo(map);

        // Layer Control
        const baseMaps = {
            "OpenStreetMap": osm,
            "Esri Satellite": satellite
        };
        const overlayMaps = {
            "Marker Jakarta": markerLayer
        };
        L.control.layers(baseMaps, overlayMaps).addTo(map);
    </script>
</body>
</html>
